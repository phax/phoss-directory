name: Maven build

on:
  push:
  pull_request:
    
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ 17, 21, 25 ]
    name: Java ${{ matrix.java }} build

    steps:
    - uses: actions/checkout@v4                  
    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD

    - name: Start LocalStack
      uses: LocalStack/setup-localstack@v0.2.3
      with:
        image-tag: 'latest'
      env:
        SERVICES: s3
        LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_TOKEN }}
        
    - name: Create S3 Bucket
      run: |
        aws --endpoint-url=http://localhost:4566 s3 mb s3://pd-export-1 --region us-east-1
        aws --endpoint-url=http://localhost:4566 s3 ls
      env:
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        AWS_DEFAULT_REGION: us-east-1
                    
    - name: Start OpenSearch
      run: |
        docker run -d -p 9200:9200 -p 9600:9600 \
          -e "discovery.type=single-node" \
          -e "DISABLE_SECURITY_PLUGIN=true" \
          -e "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g" \
          --name pd-opensearch \
          opensearchproject/opensearch:2.19.3
        # The OpenSearch conformance tests skip themselves if this never becomes reachable
        for i in $(seq 1 60); do
          curl -sf http://localhost:9200 > /dev/null && echo "OpenSearch is up" && break
          sleep 2
        done

    - name: Cache local Maven repository
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-
          
    - name: Build and deploy with Maven
      run: mvn --batch-mode --update-snapshots -P release-snapshot deploy
      if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && matrix.java == 17
      env:
        MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        
    - name: Maven Build
      run: mvn --batch-mode --update-snapshots install
      if: github.event_name != 'push' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) || matrix.java != 17
